name: Build zhenguojian ARM64 APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhenguojian-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" 'ndk;28.2.13676358'
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          python scripts/configure_signing.py
      - run: python scripts/build_android.py --all-sources --abi arm64-v8a
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk='dist/android/zhenguojian-0.2.16+22-arm64-v8a.apk'
          test -f "$apk"
          pushd dist/android
          sha256sum -c SHA256SUMS.txt
          popd
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee dist/android/apk-verification.txt
          grep -F 'Verified' dist/android/apk-verification.txt
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          "$aapt" dump badging "$apk" | tee dist/android/apk-badging.txt
          grep -F "package: name='com.duanju.duanju_app' versionCode='2022' versionName='0.2.16'" dist/android/apk-badging.txt
          grep -F "application-label:'真果鉴'" dist/android/apk-badging.txt
          zipinfo -1 "$apk" | tee dist/android/apk-contents.txt
          grep -F 'lib/arm64-v8a/libduanju_core.so' dist/android/apk-contents.txt
          if grep -E '^lib/(armeabi-v7a|x86_64)/' dist/android/apk-contents.txt; then
            exit 1
          fi
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zhenguojian-android-arm64
          path: dist/android/*
          if-no-files-found: warn
          retention-days: 14
