name: Publish verified package snapshots

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tagged build commits
        run: |
          set -euo pipefail
          test "$(git rev-parse 'v0.2.56-unverified-release-20260927-r3^{commit}')" = bbb9796546f29eec2a83f9c046df81b6855d8996
          test "$(git rev-parse 'v0.3.1-lite.1-unverified-release-20260927-r3^{commit}')" = bff62e473556ed0ff17dd5f398ac02d2cd3b631d
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/36320844312 --jq .head_sha)" = bbb9796546f29eec2a83f9c046df81b6855d8996
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/36320931716 --jq .head_sha)" = bff62e473556ed0ff17dd5f398ac02d2cd3b631d
      - name: Download package artifacts
        run: |
          set -euo pipefail
          gh run download 36320844312 -n hongguojian-windows -D "$RUNNER_TEMP/main-red-windows"
          gh run download 36320844312 -n zhenguojian-windows -D "$RUNNER_TEMP/main-all-windows"
          gh run download 36320844312 -n hongguojian-android -D "$RUNNER_TEMP/main-red-android"
          gh run download 36320844312 -n zhenguojian-android -D "$RUNNER_TEMP/main-all-android"
          gh run download 36320931716 -n hongguojian-lite-windows -D "$RUNNER_TEMP/lite-red-windows"
          gh run download 36320931716 -n zhenguojian-lite-windows -D "$RUNNER_TEMP/lite-all-windows"
          gh run download 36320931716 -n hongguojian-lite-android-arm64 -D "$RUNNER_TEMP/lite-red-android"
          gh run download 36320931716 -n zhenguojian-lite-android-arm64 -D "$RUNNER_TEMP/lite-all-android"
      - name: Stage original programs and checksums
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/main-files" "$RUNNER_TEMP/lite-files"
          cp "$RUNNER_TEMP/main-red-windows/hongguojian-0.2.56+62-windows-x64-portable.exe" "$RUNNER_TEMP/main-files/"
          cp "$RUNNER_TEMP/main-all-windows/zhenguojian-0.2.56+62-windows-x64-portable.exe" "$RUNNER_TEMP/main-files/"
          cp "$RUNNER_TEMP/main-red-android/hongguojian-0.2.56+62-arm64-v8a.apk" "$RUNNER_TEMP/main-files/"
          cp "$RUNNER_TEMP/main-all-android/zhenguojian-0.2.56+62-arm64-v8a.apk" "$RUNNER_TEMP/main-files/"
          cp "$RUNNER_TEMP/lite-red-windows/hongguojian-lite-0.3.1-lite.1+31-windows-x64-portable.exe" "$RUNNER_TEMP/lite-files/"
          cp "$RUNNER_TEMP/lite-all-windows/zhenguojian-lite-0.3.1-lite.1+31-windows-x64-portable.exe" "$RUNNER_TEMP/lite-files/"
          cp "$RUNNER_TEMP/lite-red-android/hongguojian-lite-0.3.1-lite.1+31-arm64-v8a.apk" "$RUNNER_TEMP/lite-files/"
          cp "$RUNNER_TEMP/lite-all-android/zhenguojian-lite-0.3.1-lite.1+31-arm64-v8a.apk" "$RUNNER_TEMP/lite-files/"
          test "$(find "$RUNNER_TEMP/main-files" -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(find "$RUNNER_TEMP/lite-files" -maxdepth 1 -type f | wc -l)" -eq 4
          (cd "$RUNNER_TEMP/main-files" && sha256sum *.exe *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          (cd "$RUNNER_TEMP/lite-files" && sha256sum *.exe *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish main prerelease
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/main-notes.md" <<'EOF'
          这是未验证预发行版，版本为 0.2.56+62。附件包含红果鉴与真果鉴各一份 Windows x64 单文件便携 EXE 和已签名的 Android arm64 APK；SHA256SUMS.txt 仅涵盖这四个程序文件。

          - 红果鉴只开放红果站源；真果鉴开放完整站源。两款主线 APK 共用 `com.duanju.duanju_app`，安装时互相覆盖，并沿用原数据升级路径。
          - 包级检查：两款 Windows EXE 在 CI 中实际启动并验证便携目录、播放器进度和媒体重封装；两款 APK 的既有发布证书、应用 ID、版本、名称、arm64 原生库与 SHA-256 检查通过。
          - 当前 Flutter 回归为 128 通过、17 失败、1 跳过，失败涉及收藏与历史恢复、界面刷新和下载、详情及 TV 焦点、主题、媒体合并与站源权限。后续 Flutter 全站源和 Go 回归因首组失败未执行。完整日志见 [本次 Actions 运行](https://github.com/Yaoser-x/zhenguojian-app/actions/runs/36320844312)。
          - 真实站源的浏览、搜索、详情、选集、播放和错误重试，Windows 画质增强，以及 Android/TV 实机表现仍待集中验收。
          EOF
          gh release create v0.2.56-unverified-release-20260927-r3 "$RUNNER_TEMP/main-files/"*.exe "$RUNNER_TEMP/main-files/"*.apk "$RUNNER_TEMP/main-files/SHA256SUMS.txt" --verify-tag --prerelease --title '红果鉴 / 真果鉴 0.2.56（未验证）' --notes-file "$RUNNER_TEMP/main-notes.md"
      - name: Publish Lite prerelease
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/lite-notes.md" <<'EOF'
          这是未验证预发行版，版本为 0.3.1-lite.1+31。附件包含红果鉴 Lite 与真果鉴 Lite 各一份 Windows x64 单文件便携 EXE 和已签名的 Android arm64 APK；SHA256SUMS.txt 仅涵盖这四个程序文件。

          - 红果鉴 Lite 只开放红果站源；真果鉴 Lite 开放本版全部在线站源。两款 APK 分别使用 `com.duanju.hongguojian.lite` 和 `com.duanju.zhenguojian.lite`，数据与备份保持独立。
          - 包级检查：两款 Windows EXE 在 CI 中实际启动，完成便携目录、播放器进度及缓存复用检查；两款 APK 的既有发布证书、应用 ID、版本、名称、arm64 原生库与 SHA-256 检查通过。
          - 当前 Go 核心的红果目录游标恢复、停滞处理和目录元数据保存用例失败；Flutter 红果版 76 通过、9 失败、1 跳过，全站源版 76 通过、10 失败，涉及弹幕异步与重试、播放器错误切换、TV 遥控焦点、主题、目录和详情。完整日志见 [本次 Actions 运行](https://github.com/Yaoser-x/zhenguojian-app/actions/runs/36320931716)。
          - 真实站源的浏览、搜索、详情、选集、播放和错误重试，Windows 画质增强，以及 Android/TV 实机表现仍待集中验收。
          EOF
          gh release create v0.3.1-lite.1-unverified-release-20260927-r3 "$RUNNER_TEMP/lite-files/"*.exe "$RUNNER_TEMP/lite-files/"*.apk "$RUNNER_TEMP/lite-files/SHA256SUMS.txt" --verify-tag --prerelease --title '红果鉴 Lite / 真果鉴 Lite 0.3.1-lite.1（未验证）' --notes-file "$RUNNER_TEMP/lite-notes.md"
